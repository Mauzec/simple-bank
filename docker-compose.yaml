services:
  postgres:
    image: postgres:17.4-alpine3.21
    env_file:
      - ./config/app.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./config/app.env
    environment:
      - GIN_MODE=release
    depends_on:
      - postgres
    entrypoint: [ "/app/wait-for.sh", "postgres:5432", "--", "/app/start.sh" ]
    command: [ "/app/main" ]
    restart: unless-stopped

volumes:
  pgdata:
