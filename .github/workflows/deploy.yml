name: Deploy to prod

on:
  push:
    branches:
      - ft/docker

env:
  YC_REGISTRY: cr.yandex/${{ secrets.REGISTRY_ID }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to YCR
        run: |
          echo ${{ secrets.YC_TOKEN }} | docker login --username oauth --password-stdin ${{ env.YC_REGISTRY }}
      
      - name: Build & Push with Docker Compose
        run: |
          docker compose build
          docker compose push
        env:
          REGISTRY: ${{ env.YC_REGISTRY }}
      